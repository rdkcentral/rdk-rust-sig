name: Rust Clippy

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-cargo-clippy.yml"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  push:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-cargo-clippy.yml"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
