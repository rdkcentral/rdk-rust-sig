name: Rust Coverage

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-cargo-coverage.yml"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_LLVM_COV_ARGS: "--workspace --summary-only --output-path coverage_report.txt"

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (+llvm-tools-preview)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run cargo llvm-cov
        run: cargo llvm-cov $CARGO_LLVM_COV_ARGS

      - name: Formatting Coverage Report
        run: |
          echo '### Coverage Report' > coverage_report_formatted.txt
          echo '```text' >> coverage_report_formatted.txt
          cat coverage_report.txt >> coverage_report_formatted.txt
          echo -e '\n```' >> coverage_report_formatted.txt

      - name: Post Coverage Report Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage_report_formatted.txt
