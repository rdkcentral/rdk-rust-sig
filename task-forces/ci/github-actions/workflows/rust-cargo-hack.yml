name: Rust Feature Matrix

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-cargo-hack.yml"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  push:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-cargo-hack.yml"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HACK_FLAGS: "--workspace --each-feature"

jobs:
  hack:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Run cargo hack
        run: cargo hack test $CARGO_HACK_FLAGS
