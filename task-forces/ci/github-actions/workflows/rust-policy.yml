name: Rust License Policy

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-license-policy.yml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
  push:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/rust-license-policy.yml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny license policy
        run: cargo deny check licenses bans sources
